    <script>
        // Функция для нахождения суммы (Задание 5)
        function showSum() {
            let inputA = document.getElementById('numberA');
            let inputB = document.getElementById('numberB');
            
            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value); // Исправлена синтаксическая ошибка с ";"
            let result = a + b;
            alert('Сумма ' + a + ' и ' + b + ' равна ' + result);
        }

        // Функция для нахождения разности (Самостоятельное задание)
        function showDifference() {
            let inputA = document.getElementById('numberA');
            let inputB = document.getElementById('numberB');
            
            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);
            let result = a - b;
            alert('Разность ' + a + ' и ' + b + ' равна ' + result);
        }

        // Функция для нахождения произведения (Самостоятельное задание)
        function showProduct() {
            let inputA = document.getElementById('numberA');
            let inputB = document.getElementById('numberB');
            
            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);
            let result = a * b;
            alert('Произведение ' + a + ' и ' + b + ' равно ' + result);
        }

        // Функция вывода автора страницы (Задание 6)
        function showAuthor(){
            let author = 'Автор страницы: \nСоловьев Алексей Валентинович';
            alert(author);
        }

        // Функция приветствия для подвала (Задание 6)
        function showWelcome() {
            alert("Приветствую вас на моей странице!\nДевиз: Через тернии к звёздам.");
        }
    </script>

    <style>
        .message {
            display: inline-block;         
            width: 250px;                   
            height: 100px;                  
            background-color: #f0f4f8;      
            border: 2px solid #3498db;    
            border-radius: 8px;             
            padding: 15px;                 
            margin: 10px;                   
            box-sizing: border-box;         
            font-family: Arial, sans-serif; 
            color: #2c3e50;                 
            vertical-align: top;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .message:hover {
            background-color: #e2eaf0;
        }

        header {
            cursor: pointer;
        }

        footer {
            cursor: help;
        }
    </style>

<body>
    <header onclick="showAuthor()">

    <main>
        <div style="margin: 20px 10px;">
            <label>Первое число: <input type="number" value="5154" id="numberA"></label><br><br>
            <label>Второе число: <input type="number" value="7891" id="numberB"></label><br>
        </div>

        <div class="message" onclick="showSum()">Найти сумму чисел</div>
        <div class="message" onclick="showDifference()">Найти разность чисел</div>
        <div class="message" onclick="showProduct()">Найти произведение</div>
        <div class="message" onclick="showAuthor()">Узнать, кто автор страницы</div>
    </main>
    
    <footer ondblclick="showWelcome()">
