    <script>
        function showSum() {
            let inputA = document.getElementById('numberA')
            let inputB = document.getElementById('numberB')

            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);
            let result = a + b;
            alert('Сумма '+ a +' и '+ b +' равна ' + result);
        }
        function showAuthor() {
            let author = 'Автор страницы: \nКрюков Василий Александрович'
            alert(author)
        }
        function nizclick() {
            let x = 'Добро пожаловать! \nВы находитесь на тестовой странице'
            alert(x)
        }
        function showRazn() {
            let inputA = document.getElementById('numberA')
            let inputB = document.getElementById('numberB')

            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);
            let result = a - b;
            alert('Сумма '+ a +' и '+ b +' равна ' + result);
        }
        function showProizv() {
            let inputA = document.getElementById('numberA')
            let inputB = document.getElementById('numberB')

            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);
            let result = a * b;
            alert('Произведение ' + a + ' и ' + b + ' равно ' + result);
        }
        function showDiv() {
            let inputA = document.getElementById('numberA');
            let inputB = document.getElementById('numberB');

            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);
            if(b == 0) {
                alert('На ноль делить нельзя!');
                inputB.focus();
                inputB.select();
                inputB.style.color = 'red'
                inputB.style.borderColor= 'red'
                return;
            }

            if(isNaN(a)) {
                alert('Введите числовое значение в первое поле');
                inputB.focus();
                inputB.select();
                inputB.style.color = 'red'
                inputB.style.borderColor= 'red'
                return
            }

            inputB.style.color = '';
            inputB.style.borderColor= '';

            let result = a/b;
            alert(a + " / " + b + " = " + result);
        }
        function showStep() {
            let inputA = document.getElementById('numberA');
            let inputB = document.getElementById('numberB');

            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);

            if (isNaN(a)) {
                alert("Первое значение не является числом");
                inputA.focus();
                return;
            }
            if (isNaN(b)) {
                alert("Второе значение не является числом");
                inputB.focus();
                return;
            }
            if (a == 0 && b == 0) {
                alert("Ошибка: 0 в степени 0 не определено");
                return;
            }
             let result = a ** b;
                alert(a + " в степени " + b + " = " + result);
        }
        function changeOutput(buttonNum, backColor, textColor) {
            let output = document.getElementById('output');
            output.innerHTML = 'Нажата кнопка ' + buttonNum;
            output.style.backgroundColor = backColor;
            output.style.color = textColor;
        }
    </script>

    <style>
        .message {
            cursor: pointer;
            width: 300px;
            height: 50px;
            background-color: lightblue;
            border: 2px solid black;
            border-radius: 10px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
            background-color: rgb(168, 192, 206);
            display: inline-block;
        }
        #output {
            border: 1px solid;
            width: 300px;
            height: 40px;
        }
    </style>

</head>

<body>
    <header onclick="showAuthor()">
        НГТУ, ФБ, Лабораторная работа 5
    </header>

    <main>
        <label>Первое число: <input type="number" value="5154" id="numberA"></label><br>
        <label>Второе число: <input type="number" value="7891" id="numberB"></label><br>
        <!-- <div class="message" onclick="showSum()">Сколько будет 5154+7891?</div> -->
        <div class="message" onclick="showSum()">Найти сумму чисел</div>

        <div class="message" onclick="showRazn()">Найти разность чисел</div>
        <div class="message" onclick="showProizv()">Найти произведение</div>

        <div class="message" onclick="showDiv()">Найти отношение чисел</div>
        <div class="message" onclick="showStep()">Возвести в степень</div>

        <div class="message" onclick="showAuthor()">Узнать, кто автор страницы</div>

        <div>
            <input type="button" value="Кнопка 1" onclick="changeOutput(1, 'red', 'yellow')">
            <input type="button" value="Кнопка 2" onclick="changeOutput(2, 'black', 'lime')">
            <input type="button" value="Кнопка 3" onclick="changeOutput(3, 'blue', 'white')">
            <input type="button" value="Кнопка 4" onclick="changeOutput(4, 'orange', 'black')">
        </div>

        <div id="output"></div>


    </main>

    <footer ondblclick="nizclick()">

    </footer>

</body>
