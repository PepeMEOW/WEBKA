    <script>
        function showSum() {
            let inputA = document.getElementById('numberA');
            let inputB = document.getElementById('numberB');

            inputA.style.color = "";
            inputA.style.borderColor = "";
            inputB.style.color = "";
            inputB.style.borderColor = "";

            if (inputA.value === "" || isNaN(inputA.value)) {
                alert("Ошибка ввода: первое значение должно быть числом!");
                inputA.style.color = "red";
                inputA.style.borderColor = "red";
                inputA.focus();
                inputA.select();
                return;
            }

            if (inputB.value === "" || isNaN(inputB.value)) {
                alert("Ошибка ввода: второе значение должно быть числом!");
                inputB.style.color = "red";
                inputB.style.borderColor = "red";
                inputB.focus();
                inputB.select();
                return;
            }

            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);
            let result = a + b;
            alert('Сумма ' + a + ' и ' + b + ' равна ' + result);
        }

        function showDifference() {
            let inputA = document.getElementById('numberA');
            let inputB = document.getElementById('numberB');

            inputA.style.color = "";
            inputA.style.borderColor = "";
            inputB.style.color = "";
            inputB.style.borderColor = "";

            if (inputA.value === "" || isNaN(inputA.value)) {
                alert("Ошибка ввода: первое значение должно быть числом!");
                inputA.style.color = "red";
                inputA.style.borderColor = "red";
                inputA.focus();
                inputA.select();
                return;
            }

            if (inputB.value === "" || isNaN(inputB.value)) {
                alert("Ошибка ввода: второе значение должно быть числом!");
                inputB.style.color = "red";
                inputB.style.borderColor = "red";
                inputB.focus();
                inputB.select();
                return;
            }

            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);
            let result = a - b;
            alert('Разность ' + a + ' и ' + b + ' равна ' + result);
        }

        function showProduct() {
            let inputA = document.getElementById('numberA');
            let inputB = document.getElementById('numberB');

            inputA.style.color = "";

            inputB.style.color = "";

                return;
            }

            if (inputB.value === "" || isNaN(inputB.value)) {
                alert("Ошибка ввода: второе значение должно быть числом!");
                inputB.style.color = "red";
                inputB.style.borderColor = "red";
                inputB.focus();
                inputB.select();
                return;
            }

            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);
            let result = a * b;
            alert('Произведение ' + a + ' и ' + b + ' равно ' + result);
        }

        // НОВАЯ ФУНКЦИЯ ДЛЯ ОТНОШЕНИЯ ЧИСЕЛ (Задание 10)
        function showDivision() {
            let inputA = document.getElementById('numberA');
            let inputB = document.getElementById('numberB');

            inputA.style.color = "";
            inputA.style.borderColor = "";
            inputB.style.color = "";
            inputB.style.borderColor = "";

            if (inputA.value === "" || isNaN(inputA.value)) {
                alert("Ошибка ввода: первое значение должно быть числом!");
                inputA.style.color = "red";
                inputA.style.borderColor = "red";
                inputA.focus();
                inputA.select();
                return;
            }

            if (inputB.value === "" || isNaN(inputB.value)) {
                alert("Ошибка ввода: второе значение должно быть числом!");
                inputB.style.color = "red";
                inputB.style.borderColor = "red";
                inputB.focus();
                inputB.select();
                return;
            }

            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);

            // Проверка частного случая — деление на ноль
            if (b === 0) {
                alert("Ошибка: нельзя делить на ноль! Введите другое второе число.");
                inputB.style.color = "red";
                inputB.style.borderColor = "red";
                inputB.focus();
                inputB.select();
                return;
            }

            let result = a / b;
            alert('Отношение ' + a + ' к ' + b + ' равно ' + result);
        }
