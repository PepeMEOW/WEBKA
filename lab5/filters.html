<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Соловьев Алексей — Фильтры</title>
    <link rel="stylesheet" href="C:\Users\Alexe\OneDrive\Рабочий стол\Конспекты\Вебка\WEBKA\main.css">
    <link rel="icon" href="C:\Users\Alexe\OneDrive\Рабочий стол\Конспекты\photo_5242615177071499852_y.jpg" type="image/x-icon">
    
    <script>
        function blurChange() {
            let slider = document.getElementById('blurValue');
            let img = document.getElementById('targetImg');
            let textOutput = document.getElementById('blurText');
            
            let val = slider.value + 'px';
            
            textOutput.innerText = val;
            img.style.filter = 'blur(' + val + ')';
        }
    </script>

    <style>
        main {
            padding: 20px;
            text-align: center;
        }
        .controls-wrapper {
            margin-bottom: 20px;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
        input[type="range"] {
            vertical-align: middle;
            margin: 0 10px;
            width: 200px;
        }
        #blurText {
            font-weight: bold;
            color: #3498db;
        }
        .image-container {
            margin: 0 auto;
            max-width: 600px;
            border: 2px solid #ccc;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header onclick="alert('Автор: Соловьев Алексей')">
        <hr>
        НГТУ, ФБ, ЛР 5 — Фильтры
        <hr>
    </header>
    
    <main>
        <div class="controls-wrapper">
            <label for="blurValue">Размытие (blur):</label>
            <input type="range" id="blurValue" min="0" max="20" value="0" oninput="blurChange()" onchange="blurChange()">
            <span id="blurText">0px</span>
        </div>

        <div class="image-container">
            <img id="targetImg" src="C:\Users\Alexe\OneDrive\Рабочий стол\Конспекты\Вебка\WEBKA\lab5\i.jpg" alt="Цветное изображение">
        </div>
    </main>

    <footer>
        <hr>
        &copy; Соловьев Алексей, ФБИ-41 2 курс, 2026
    </footer>
</body>
</html>
