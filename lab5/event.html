<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Событие</title>
    <link rel="stylesheet" href="C:\Users\Alexe\OneDrive\Рабочий стол\Конспекты\Вебка\WEBKA\main.css">
    <link rel="icon" href="C:\Users\Alexe\OneDrive\Рабочий стол\Конспекты\photo_5242615177071499852_y.jpg" type="image/x-icon">

    <style>
        #block {
            width: 300px;
            height: 300px;
            border: 2px solid black;
            background-color: lightgray;
            cursor: crosshair;
            padding: 10px;
        }
    </style>

    <script>
        function showCoords() {
            let x = this.event.x;
            let y = this.event.y;
            let div = document.getElementById('block')
            let text = '<b>x</b> = ' + x + 'px<br><b>y</b> = ' + y + 'px';

            if(this.event.ctrlKey) {
                div.style.color = 'red';
                div.style.backgroundColor = 'pink';

                text += '<br>Нажата Ctrl';
            }
            else if(this.event.shiftKey) {
                div.style.color = 'blue';
                div.style.border = '4px dashed blue';

                text += '<br>Нажата Shift';
            }
            else if(this.event.altKey) {
                div.style.color = 'green';
                div.style.backgroundColor = 'lightgreen';

                text += '<br>Нажата Alt';
            }
            else
                div.style.color = 'black';

            div.innerHTML = text;
        
        }
    </script>

</head>

<body>
    <header>
        НГТУ, ФБ, Лабораторная работа 5
    </header>

    <main>
       <div id="block" onmousemove="showCoords()"></div>
    </main>

    <footer>
        &copy; Соловьев Алексей, ФБИ-41, 2 курс, 2026
    </footer>

</body>
</html>
