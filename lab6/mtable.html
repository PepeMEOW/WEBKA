<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа 5</title>
    <link rel="stylesheet" href="../main.css">
    <style>
        #mtable { border: 2px solid #333; padding: 15px; display: inline-block; margin-bottom: 15px; }
        .row { font-family: monospace; font-size: 16px; }
        .controls { display: flex; flex-direction: column; gap: 8px; width: 220px; }
        .controls div { display: flex; justify-content: space-between; }
        .controls input { width: 60px; }
    </style>
    <script>
        function showMutipleTable() {
            let tbl = document.getElementById('mtable');
            let factor = +document.getElementById('factor').value;
            let start = +document.getElementById('start').value;
            let end = +document.getElementById('end').value;

            if (start > end) {
                [start, end] = [end, start];
                document.getElementById('start').value = start;
                document.getElementById('end').value = end;
            }

            tbl.innerHTML = `<h3>Таблица умножения на ${factor}</h3>`;
            for (let i = start; i <= end; i++) {
                tbl.innerHTML += `<div class="row">${i} * ${factor} = ${i * factor}</div>`;
            }
        }
    </script>
</head>
<body onload="showMutipleTable()">
    <header><hr> НГТУ, ФБ, Лабораторная работа 5 <hr></header>
    <main>
        <div id="mtable"></div>
        <div class="controls">
            <div><label>Умножить на:</label><input id="factor" type="number" value="7"></div>
            <div><label>Начать с:</label><input id="start" type="number" value="1"></div>
            <div><label>Закончить на:</label><input id="end" type="number" value="10"></div>
            <button onclick="showMutipleTable()">Таблица</button>
        </div>
    </main>
    <footer><hr> &copy; Соловьев Алексей, ФБИ-41 2 курс, 2026 </footer>
</body>
</html>
